[mcp]
safe_mode = true
# External MCP tool exposure: full (default), progressive, or core.
# Progressive saves schema context and can help local or smaller models.
tool_profile = full
# Switch individual tool modules off (or restrict to an allowlist) regardless of
# profile. Names are maxmcp/tools/*.py module names, comma separated.
# Environment overrides: MCP_DISABLED_MODULES / MCP_ENABLED_MODULES.
disabled_modules =
enabled_modules =
# TCP fallback is opt-in via the MCP Start macroscript. Keep idle polling sparse
# to avoid viewport stutter when the native bridge is unavailable.
tcp_idle_poll_interval_ms = 1500
tcp_active_poll_interval_ms = 50
tcp_active_poll_ticks_after_request = 10
